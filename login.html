<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="reset.css" />
  <link rel="stylesheet" href="login.css" />
  <title>판다마켓</title>

  <!-- Google tag (gtag.js) -->

<body>
  <main class="main">
    <div class="container login">
      <a class="logo-login" href="https://pandamarket-powerima.netlify.app/">
        <img src="images/logo_pandamarket.svg" alt="귀여운 판다 얼굴 그림과 우측에 판다마켓이라고 쓰여있는 로고 이미지"/></a>
      <div class="container email">
        <label for="email">이메일</label>
        <input type="text" name="email" placeholder="이메일을 입력해주세요"/>
      </div>
      <div class="container password">
        <label for="password">비밀번호</label>   
        <input type="password" name="password" placeholder="비밀번호를 입력해주세요" />        
        <img class="img-icon eye" src="images/ic_btn_visibility_on.svg"/>
      </div>   
      <a class="button disabled login" href="#">로그인</a>
      <div class="block sns-login">
        <span>간편 로그인하기</span>
        <div class="sns-list">
          <a href="https://www.google.com" target="_blank"><img src="images/google_icon.png" alt="구글 로고 아이콘"/></a>
          <a href="https://www.kakaocorp.com/page/" target="_blank"><img src="images/kakao_icon.png" alt="카카오톡 아이콘"/></a>
        </div>
      </div>
      <div class="sign-up">
        <span>판다마켓이 처음이신가요? <a href="signup.html">회원가입</a></span>
