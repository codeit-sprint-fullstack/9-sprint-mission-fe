<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <!-- CSS리셋 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
    <!-- 프리텐다드 웹폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="login.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NE5HC2GRVQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-NE5HC2GRVQ');
</script>
</head>
<body>
    <!-- 내용 컨테이너 -->
    <div class="login-container">
        <!-- 로고부분 -->
        <div class="login-logo">
            <a href="/index.html">
                <img src="image/login-logo.png" alt="판다마켓 로고">
            </a>
        </div>
        <!-- 로그인 폼 -->
        <form class="login-form">
                <div class="login-label">
                    <label for="login-id">이메일</label>
                </div>
                <div class="login-input">
                    <input id="login-id" type="email" required placeholder="이메일을 입력해주세요">
                </div>
                <div class="login-label">  
                    <label for="login-pw">비밀번호</label>
                </div>
                <div class="login-input">
                    <input id="login-pw" type="password" required placeholder="비밀번호를 입력해주세요">
                    <img class="eye-icon" src="/image/secret-eye.png" alt="비밀번호 보기">
                </div> 
                <button class="login-button" type="submit">로그인</button>
        </form>
        <!-- 간편 로그인 -->
        <div class="easy-login">
            <span id="easy-text">간편 로그인하기</span>
            <div class="social-login">
                <a href="https://www.google.com/">
                    <img class="google" src="image/google_logo.png" alt="google_logo">
                </a>
                <a href="https://www.kakaocorp.com/page/">                
                    <img class="kakao" src="image/kakao_logo.png" alt="kakao_logo">    
                </a>
            </div>
        </div>
        <!-- 회원가입 CTA-->
        <div class="sign-up">
            <span id="question-text">판다마켓이 처음이신가요?</span>
            <a id="sign-up-button" href="/signup.html">회원가입</a>
        </div>
    </div>
</body>
</html>
