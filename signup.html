<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-91FC3FP4RX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-91FC3FP4RX');
  </script>
  <!-- End Google Tag Manager -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style/reset.css">
  <link rel="stylesheet" href="./style/fontface.css">
  <link rel="stylesheet" href="./style/style.css">
  <link rel="stylesheet" href="./style/login.css">
  <title>판다마켓-회원가입</title>
</head>
<body>
  <main id="login-main">
    <h1 id="l-logo">
      <a href="/"><img src="./img/logox2.png" alt="판다마켓 로고"></a>
    </h1>
    <form id="signup" class="login-form" action="">
      <div class="input-section">
        <label for="email">이메일</label>
        <div class="value-box">
          <input type="email" id="email" name="email" placeholder="이메일을 입력해주세요" required />
        </div>   
      </div>
      <div class="input-section">
        <label for="nickname">닉네임</label>
        <div class="value-box">
          <input type="text" id="nickname" name="nickname" placeholder="닉네임을 입력해주세요" required />
        </div>
      </div>
      <div class="input-section">
        <label for="password">비밀번호</label>
        <div class="value-box">
          <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요" required />
          <button class="pw-view-toggle"><img src="./img/btn_visibility_on_24px.png" alt="비밀번호 표시 토글, 숨김상태"></button>
        </div>      
      </div>
      <div class="input-section">
        <label for="password-chk">비밀번호 확인</label>
        <div class="value-box">
          <input type="password" id="password-chk" name="password-chk" placeholder="비밀번호를 다시 한 번 입력해주세요" required />
          <button class="pw-view-toggle"><img src="./img/btn_visibility_on_24px.png" alt="비밀번호 표시 토글, 숨김상태"></button>
        </div>     
      </div>
      <div class="submit-section">
        <input class="l-btn" id="submit" type="submit" value="회원가입" />
      </div>
    </form>
    <div id="oauth-box">
      <span>간편 로그인하기</span>
      <div id="oauth-btn-grup">
        <a class="oauth-btn" href="https://google.com"><img src="./img/google.png" alt=""></a>
        <a class="oauth-btn" href="https://www.kakaocorp.com/page/"><img src="./img/kakao.png" alt=""></a>
      </div>
    </div>
    <p id="noti-signup">이미 회원이신가요? <a href="/login">로그인</a></p>
  </main>
  <script src="./js/login.js"></script>
</body> 
</html>
