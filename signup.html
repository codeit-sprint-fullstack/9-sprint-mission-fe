<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style/global.css" />
  <link rel="stylesheet" href="style/auth.css" />
  <title>판다마켓</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-46P33X5L32"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-46P33X5L32');
  </script>
</head>
<body>
  <main class="page-main">
    <div class="auth-container">
      <a class="logo-auth" href="https://pandamarket-powerima.netlify.app/">
        <img src="images/logo_pandamarket.svg" alt="귀여운 판다 얼굴 그림과 우측에 판다마켓이라고 쓰여있는 로고 이미지" /></a>
      <div class="input-item">
        <label for="email">이메일</label>
        <input type="text" name="email" placeholder="이메일을 입력해주세요"/>
      </div>
      <div class="input-item">
        <label for="nickname">닉네임</label>
        <input type="text" name="nickname" placeholder="닉네임을 입력해주세요"/>
      </div>
      <div class="input-item">
        <label for="password">비밀번호</label>   
        <input type="password" name="password" placeholder="비밀번호를 입력해주세요" />        
        <img class="img-icon" src="images/ic_btn_visibility_on.svg"/>
      </div>   

      <div class="input-item">
        <label for="password-re">비밀번호 확인</label>   
        <input type="password" name="password-re" placeholder="비밀번호를 다시 한 번 입력해주세요" />        
        <img class="img-icon" src="images/ic_btn_visibility_on.svg"/>
      </div>   
      
      
      <a class="button disabled auth" href="#">회원가입</a>
      <div class="block sns-login">
        <span>간편 로그인하기</span>
        <div class="sns-list">
          <a href="https://www.google.com" target="_blank"><img src="images/google_icon.png" alt="구글 로고 아이콘"/></a>
          <a href="https://www.kakaocorp.com/page/" target="_blank"><img src="images/kakao_icon.png" alt="카카오톡 아이콘"/></a>
        </div>
      </div>
      <div class="auth-check">
        <span>이미 회원이신가요? <a href="login.html">로그인</a></span>
      </div>
    </div>
  </main>  
</body>
</html>
