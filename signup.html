<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
        <link rel="stylesheet" href="reset.css">
<link rel="stylesheet" href="signup.css" type="text/css" />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-F55ED7P0L4"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-F55ED7P0L4");
    </script>
  </head>
  <body>
    <div class="center">
      <div>
        <a href="/" class="pglogo" style="text-decoration: none">
          <img src="loginlogo.png" class="login-icon" />
        </a>
      </div>
      <form action="">
        <div class="input-wrap">
          <label for="email">이메일</label>
          <input id="email" type="email" placeholder="이메일을 입력해주세요" />
        </div>
        <div id="emailError" class="error-msg"></div>
        <div class="input-wrap">
          <label for="nickname">닉네임</label>
          <input id="nickname" type="text" placeholder="닉네임을 입력해주세요" />
        </div>
                <div id="nicknameError" class="error-msg"></div>
        <div class="input-wrap">
          <label for="password">비밀번호</label>
          <div>
            <input id="password" type="password" placeholder="비밀번호를 입력해주세요" />
            <img src="btn_visibility.png" id="visibilityOff" class="passwordVisibility" />
            <img src="btn_visibilityOn.png" id="visibilityOn" class="passwordVisibility" />
          </div>
        </div>
        <div id="passwordError" class="error-msg"></div>
        <div class="input-wrap">
          <label for="password-check">비밀번호 확인</label>
        <div>
          <input id="passwordCheck" type="password" placeholder=" 다시 한 번 확인해주세요" />
          <img src="btn_visibility.png" id="visibilityOffCheck" class="confirm-passwordVisibility" />
          <img src="btn_visibilityOn.png" id="visibilityOnCheck" class="confirm-passwordVisibility" />
          </div>
        </div>
        <div id="passwordCheckError" class="error-msg"></div>
        <button disabled type="button" id="signup" class="signup-link" >
          회원가입
        </button>
      </form>
      <div class="easy-login">
        <div class="login-text">간편 로그인하기</div>
        <div class="sns-group">
          <a href="https://www.google.com/" class="google">
            <img src="google.png" class="sns-icon" />
          </a>
          <a href="https://www.kakaocorp.com/page/" class="kakao">
            <img src="kakaotalk.png" class="sns-icon" />
          </a>
        </div>
      </div>
      <div class="first-message">
        이미 회원이신가요?
        <a href="/login.html" class="login-link"> 로그인</a>
      </div>
    </div>
        <div id="modal" class="modal_hidden">
      <div class="modal-content">
        <p id="errorMessage"></p>
        <button id="closeBtn">확인</button>
      </div>
    </div>
        <script src="signup.js"></script>
  </body>
</html>
