<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>판다마켓 - 회원가입</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/signup.css" />
    <link rel="icon" href="./images/favicon.ico" />
  </head>

  <body>
    <div class="login-container">
      <!-- 로고 및 브랜드 -->
      <header class="login-header">
        <a href="./index.html">
          <img class="brand-logo" src="./images/panda-face.svg" alt="판다 로고" />
          <h1 class="logo">판다마켓</h1>
        </a>
      </header>

      <!-- 회원가입 폼 -->
      <main class="login-main">
        <form id="signupForm" novalidate>
          <!-- 이메일 -->
          <div class="input-group">
            <label for="signupEmail">이메일</label>
            <input
              type="email"
              id="signupEmail"
              name="email"
              placeholder="이메일을 입력해주세요"
              autocomplete="off"
              required
            />
            <div id="signupEmailError" class="error-message" aria-live="polite"></div>
          </div>

          <!-- 닉네임 -->
          <div class="input-group">
            <label for="signupName">닉네임</label>
            <input
              type="text"
              id="signupName"
              name="name"
              placeholder="닉네임을 입력해주세요"
              autocomplete="off"
              required
            />
            <div id="signupNameError" class="error-message" aria-live="polite"></div>
          </div>

          <!-- 비밀번호 -->
          <div class="input-group password-group">
            <label for="signupPassword">비밀번호</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="signupPassword"
                name="password"
                placeholder="비밀번호를 입력해주세요"
                autocomplete="off"
                required
              />
              <img
                src="./images/eyeoff.svg"
                alt="비밀번호 보이기"
                class="toggle-password"
                role="button"
                tabindex="0"
              />
            </div>
            <div id="signupPasswordError" class="error-message" aria-live="polite"></div>
          </div>

          <!-- 비밀번호 확인 -->
          <div class="input-group password-group">
            <label for="signupPasswordConfirm">비밀번호 확인</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="signupPasswordConfirm"
                name="passwordConfirm"
                placeholder="비밀번호를 다시 입력해주세요"
                autocomplete="off"
                required
              />
              <img
                src="./images/eyeoff.svg"
                alt="비밀번호 보이기"
                class="toggle-password"
                role="button"
                tabindex="0"
              />
            </div>
            <div id="signupPasswordConfirmError" class="error-message" aria-live="polite"></div>
          </div>

          <button type="submit" class="btn-primary" disabled>회원가입</button>
        </form>

        <!-- 소셜 로그인 -->
        <div class="social-login">
          <p>간편 로그인하기</p>
          <div class="social-icons">
            <a href="https://www.google.com/" class="social-btn google" aria-label="구글 로그인">
              <img src="./images/google.svg" alt="구글 로고" />
            </a>
            <a href="https://www.kakaocorp.com/page/" class="social-btn kakao" aria-label="카카오 로그인">
              <img src="./images/kakao.svg" alt="카카오 로고" />
            </a>
          </div>
        </div>

        <!-- 로그인 이동 -->
        <div class="signup-container">
          <span>이미 회원이신가요?</span>
          <a href="./login.html">로그인</a>
        </div>
      </main>
    </div>
    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal-content">
        <p id="modalMessage" class="modal-message"></p>
        <button id="modalButton" class="modal-button">확인</button>
      </div>
    </div>
    <script src="./script/pages/signup.js" type="module"></script>
  </body>
</html>
