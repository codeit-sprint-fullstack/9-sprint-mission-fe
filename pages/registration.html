<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품 등록 - 판다마켓</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Pretendard', sans-serif;
        background-color: #f9fafb;
        margin: 0;
        padding: 0;
      }

      /* 상단 네비게이션 */
      .header-nav {
        background-color: white;
        border-bottom: 1px solid #e5e7eb;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .nav-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 64px;
      }

      .brand-logo {
        font-size: 20px;
        font-weight: 700;
        color: #3692FF;
        text-decoration: none;
      }

      .nav-menu-group {
        display: flex;
        gap: 16px;
      }

      .nav-menu-group a {
        padding: 8px 16px;
        text-decoration: none;
        color: #6b7280;
        font-weight: 500;
        transition: color 0.2s;
      }

      .nav-menu-group a:hover {
        color: #111827;
      }

      .nav-menu-group a.active {
        color: #3692FF;
        font-weight: 600;
      }

      .login-button {
        padding: 8px 24px;
        background-color: #3b82f6;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: background-color 0.2s;
      }

      .login-button:hover {
        background-color: #2563eb;
      }

      /* 메인 컨텐츠 */
      .main-content {
        max-width: 896px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      .page-title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 32px;
        color: #111827;
      }

      .registration-form {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      .form-label {
        font-size: 14px;
        font-weight: 500;
        color: #374151;
        margin-bottom: 8px;
      }

      .form-label .required {
        color: #ef4444;
      }

      /* 입력 필드 */
      .form-input,
      .form-textarea {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        font-family: 'Pretendard', sans-serif;
        transition: all 0.2s;
        background-color: #f9fafb;
      }

      .form-input:focus,
      .form-textarea:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .form-input.error,
      .form-textarea.error {
        border-color: #ef4444;
      }

      .form-input.error:focus,
      .form-textarea.error:focus {
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
      }

      .form-textarea {
        resize: none;
        min-height: 120px;
      }

      /* 에러 메시지 */
      .error-message {
        color: #ef4444;
        font-size: 12px;
        margin-top: 4px;
      }

      /* 태그 영역 */
      .tags-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .tag-chip {
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        background-color: #f3f4f6;
        color: #374151;
        border-radius: 999px;
        font-size: 14px;
        gap: 6px;
        transition: background-color 0.2s;
      }

      .tag-chip:hover {
        background-color: #e5e7eb;
      }

      .tag-remove {
        cursor: pointer;
        color: #6b7280;
        font-weight: 600;
        transition: color 0.2s;
      }

      .tag-remove:hover {
        color: #374151;
      }

      /* 등록 버튼 */
      .submit-button {
        width: 100%;
        padding: 16px;
        background-color: #d1d5db;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: not-allowed;
        transition: all 0.2s;
      }

      .submit-button.active {
        background-color: #3b82f6;
        cursor: pointer;
      }

      .submit-button.active:hover {
        background-color: #2563eb;
      }

      .submit-button.active:active {
        transform: scale(0.98);
      }

      /* 반응형 디자인 */
      @media (max-width: 768px) {
        .page-title {
          font-size: 24px;
        }

        .nav-menu-group {
          display: none;
        }
      }

      @media (max-width: 480px) {
        .main-content {
          padding: 24px 16px;
        }

        .page-title {
          font-size: 20px;
          margin-bottom: 24px;
        }
      }
    </style>
  </head>

  <body>
    <!-- 상단 네비게이션 -->
    <nav class="header-nav">
      <div class="nav-container">
        <a href="index.html" class="brand-logo">판다마켓</a>

        <div class="nav-menu-group">
          <a href="board.html">자유게시판</a>
          <a href="market.html" class="active">중고마켓</a>
        </div>

        <a href="login.html" class="login-button">로그인</a>
      </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
      <h1 class="page-title">상품 등록하기</h1>

      <div class="registration-form">
        <!-- 상품명 -->
        <div class="form-group">
          <label class="form-label">상품명 <span class="required">*</span></label>
          <input
            type="text"
            id="productName"
            class="form-input"
            placeholder="상품명을 입력해주세요"
          />
          <div id="productNameError" class="error-message"></div>
        </div>

        <!-- 상품 소개 -->
        <div class="form-group">
          <label class="form-label">상품 소개 <span class="required">*</span></label>
          <textarea
            id="description"
            class="form-textarea"
            placeholder="상품 소개를 입력해주세요"
            rows="5"
          ></textarea>
          <div id="descriptionError" class="error-message"></div>
        </div>

        <!-- 판매 가격 -->
        <div class="form-group">
          <label class="form-label">판매 가격 <span class="required">*</span></label>
          <input
            type="text"
            id="price"
            class="form-input"
            placeholder="판매 가격을 입력해주세요"
          />
          <div id="priceError" class="error-message"></div>
        </div>

        <!-- 태그 -->
        <div class="form-group">
          <label class="form-label">태그</label>
          <input
            type="text"
            id="tagInput"
            class="form-input"
            placeholder="태그를 입력 후 Enter"
          />
          <div id="tagError" class="error-message"></div>
          <div id="tagsContainer" class="tags-container"></div>
        </div>

        <!-- 등록 버튼 -->
        <button id="submitButton" class="submit-button" disabled>등록</button>
      </div>
    </main>

    <script>
      // 폼 데이터 관리
      const formData = {
        productName: '',
        description: '',
        price: '',
        tags: []
      };

      const errors = {
        productName: '',
        description: '',
        price: '',
        tag: ''
      };

      // DOM 요소
      const productNameInput = document.getElementById('productName');
      const descriptionInput = document.getElementById('description');
      const priceInput = document.getElementById('price');
      const tagInput = document.getElementById('tagInput');
      const tagsContainer = document.getElementById('tagsContainer');
      const submitButton = document.getElementById('submitButton');

      // 유효성 검사 함수
      function validateProductName(value) {
        if (!value || value.length === 0) {
          return '상품명을 입력해주세요';
        }
        if (value.length > 10) {
          return '상품명은 10자 이내로 입력해주세요';
        }
        return '';
      }

      function validateDescription(value) {
        if (!value || value.length === 0) {
          return '상품 소개를 입력해주세요';
        }
        if (value.length < 10) {
          return '상품 소개는 10자 이상 입력해주세요';
        }
        if (value.length > 100) {
          return '상품 소개는 100자 이내로 입력해주세요';
        }
        return '';
      }

      function validatePrice(value) {
        if (!value) {
          return '판매 가격을 입력해주세요';
        }
        if (isNaN(value) || Number(value) <= 0) {
          return '올바른 가격을 입력해주세요';
        }
        return '';
      }

      function validateTag(value) {
        if (value.length > 5) {
          return '태그는 5글자 이내로 입력해주세요';
        }
        return '';
      }

      // 에러 표시 함수
      function showError(inputId, errorId, errorMessage) {
        const input = document.getElementById(inputId);
        const errorElement = document.getElementById(errorId);
        
        if (errorMessage) {
          input.classList.add('error');
          errorElement.textContent = errorMessage;
        } else {
          input.classList.remove('error');
          errorElement.textContent = '';
        }
      }

      // 폼 유효성 검사
      function isFormValid() {
        return (
          formData.productName.trim() !== '' &&
          formData.description.trim() !== '' &&
          formData.price !== '' &&
          !errors.productName &&
          !errors.description &&
          !errors.price &&
          formData.productName.length >= 1 &&
          formData.productName.length <= 10 &&
          formData.description.length >= 10 &&
          formData.description.length <= 100 &&
          !isNaN(formData.price) &&
          Number(formData.price) > 0
        );
      }

      // 등록 버튼 상태 업데이트
      function updateSubmitButton() {
        if (isFormValid()) {
          submitButton.classList.add('active');
          submitButton.disabled = false;
        } else {
          submitButton.classList.remove('active');
          submitButton.disabled = true;
        }
      }

      // 태그 렌더링
      function renderTags() {
        tagsContainer.innerHTML = formData.tags
          .map((tag, index) => `
            <div class="tag-chip">
              #${tag}
              <span class="tag-remove" onclick="removeTag(${index})">✕</span>
            </div>
          `)
          .join('');
      }

      // 태그 제거
      function removeTag(index) {
        formData.tags.splice(index, 1);
        renderTags();
      }

      // 상품명 입력 이벤트
      productNameInput.addEventListener('input', (e) => {
        formData.productName = e.target.value;
        errors.productName = validateProductName(formData.productName);
        showError('productName', 'productNameError', errors.productName);
        updateSubmitButton();
      });

      // 상품 소개 입력 이벤트
      descriptionInput.addEventListener('input', (e) => {
        formData.description = e.target.value;
        errors.description = validateDescription(formData.description);
        showError('description', 'descriptionError', errors.description);
        updateSubmitButton();
      });

      // 판매 가격 입력 이벤트
      priceInput.addEventListener('input', (e) => {
        formData.price = e.target.value;
        errors.price = validatePrice(formData.price);
        showError('price', 'priceError', errors.price);
        updateSubmitButton();
      });

      // 태그 입력 이벤트
      tagInput.addEventListener('input', (e) => {
        errors.tag = validateTag(e.target.value);
        showError('tagInput', 'tagError', errors.tag);
      });

      // 태그 Enter 키 이벤트
      tagInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const value = tagInput.value.trim();
          
          if (value && value.length <= 5) {
            formData.tags.push(value);
            renderTags();
            tagInput.value = '';
            errors.tag = '';
            showError('tagInput', 'tagError', '');
          }
        }
      });

      // 등록 버튼 클릭 이벤트
      submitButton.addEventListener('click', async () => {
        if (!isFormValid()) return;

        try {
          const response = await fetch('https://panda-market-api.vercel.app/products', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              name: formData.productName,
              description: formData.description,
              price: Number(formData.price),
              tags: formData.tags
            })
          });

          if (response.ok) {
            const data = await response.json();
            alert('상품이 등록되었습니다!');
            // 상품 상세 페이지로 이동 (현재는 빈 페이지)
            window.location.href = `item-detail.html?id=${data.id}`;
          } else {
            alert('상품 등록에 실패했습니다.');
          }
        } catch (error) {
          console.error('상품 등록 실패:', error);
          alert('상품 등록 중 오류가 발생했습니다.');
        }
      });
    </script>
  </body>
</html>
