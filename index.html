<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="menu-bar">
        <div class="menu-bar-container">
            <a class="logo" href="/">
                <img src="image/panda-market-logo.png" alt="판다마켓 로고">
            </a>
            <a class="login-button" href="login.html">로그인</a>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="hero-container">
                <div class="hero-text">
                    <h2>일상의 모든 물건을<br>거래해 보세요</h2>
                    <a class="button" href="items.html">구경하러 가기</a>
                </div>
                <div class="panda-image">
                    <img src="image/panda-image.png" alt="물건들 사이에 있는 판다 캐릭터">
                </div>
            </div>
        </section>

        <section class="features-section">
            <div class="features-container">
                <div class="feature-item-1">
                    <div class="feature-image">
                        <img src="image/feature-1.png" alt="인기 상품">
                    </div>
                    <div class="feature-text-group">
                        <p class="feature-title">Point</p>
                        <h3>인기 상품을 확인해 보세요</h3>
                        <p>가장 HOT한 중고 물품을<br>실시간으로 확인해 보세요</p>
                    </div>
                </div>
                <div class="feature-item-2">
                    <div class="feature-text-group">
                        <p class="feature-title">Search</p>
                        <h3>구매를 원하는<br>상품을 검색하세요</h3>
                        <p>구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
                    </div>
                    <div class="feature-image">
                        <img src="image/feature-2.png" alt="상품 검색">
                    </div>
                </div>
                <div class="feature-item-3">
                    <div class="feature-image">
                        <img src="image/feature-3.png" alt="상품 등록">
                    </div>
                    <div class="feature-text-group">
                        <p class="feature-title">Register</p>
                        <h3>판매를 원하는<br>상품을 등록하세요</h3>
                        <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="last-section">
            <div class="last-section-container">
                <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>
                <img src="image/bottom-panda-image.png" alt="믿을 수 있는 판다마켓 중고 거래 일러스트">
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <span class="copyright-text">@codeit - 2024</span>
            <div class="footer-links">
                <a href="privacy.html">Privacy Policy</a>
                <a href="faq.html">FAQ</a>
            </div>
            <div class="social-icons">
                <a href="https://www.facebook.com/" target="_blank">
                    <img class="icon" src="image/ic_facebook.png" alt="Facebook">
                </a>
                <a href="https://twitter.com/" target="_blank">
                    <img class="icon"  src="image/ic_twitter.png" alt="Twitter">
                </a>
                <a href="https://www.youtube.com/" target="_blank">
                    <img class="icon"  src="image/ic_youtube.png" alt="YouTube">
                </a>
                <a href="https://www.instagram.com/" target="_blank">
                    <img class="icon" src="image/ic_instagram.png" alt="Instagram">
                </a>
            </div>
        </div>
    </footer>

</body>
</html>
