  <title>판다마켓</title>

<body>
  <header id="header">
    <nav id="nav">  
      <h1 id="title"><a href="/"><img src="./img/title.png" alt="판다마켓 타이틀"></a></h1>
      <div id="nav-right">
        <a id="btn-login" class="s-btn" href="/login" >로그인</a>
      </div>
    </nav>
  </header>
  <div id="header-gap"></div> <!--fixed된 header와 아래 다른 요소의 위치 보정을 위한 임시적 갭-->
  <main id="intro-big-box">
    <section class="intro-top">
      <div class="intro-tobo-item">
        <div class="tobo-text">
          <h2>일상의 모든 물건을 <br>거래해 보세요</h2>
          <a class="l-btn" href="/items">구경하러 가기</a>
        </div>
        <img class="tobo-img" src="./img/Img_home_top.png" alt="장바구니를 들며 인사하는 판다 캐릭터">
      </div>
    </section>
    <section class="intro-content">
      <div class="intro-content-item">
          <img src="./img/Img_home_01.png" alt="인기 상품을 확인하는 두 판다 캐릭터">
          <div class="intro-content-text">
            <h3>Hot item</h3>
            <h2>인기 상품을 <br>확인해 보세요</h2>
            <p>가장 HOT한 중고거래 물품을 <br>판다 마켓에서 확인해 보세요</p>
          </div>
      </div>
    </section>
    <section class="intro-content">
      <div class="intro-content-item  intro-content-item-reverse">
          <img src="./img/Img_home_02.png" alt="돋보기와 물음표가 그려진 박스. 검색을 표현한 일러스트">
          <div class="intro-content-text">
            <h3>Search</h3>
            <h2>구매를 원하는 <br>상품을 검색하세요</h2>
            <p>구매하고 싶은 물품은 검색해서 <br>쉽게 찾아보세요</p>
          </div>
      </div>
    </section>
    <section class="intro-content">
      <div class="intro-content-item">
          <img src="./img/Img_home_03.png" alt="요술봉, 폴더 아이콘, 각종 상품을 나타내는 일러스트. 상품 등록을 표현한 일러스트.">
          <div class="intro-content-text">
            <h3>Register</h3>
            <h2>판매를 원하는 <br>상품을 등록하세요</h2>
            <p>어떤 물건이든 판매하고 싶은 상품을 <br>쉽게 등록하세요</p>
          </div>
      </div>
    </section>
    <section class="intro-bottom">
      <div class="intro-tobo-item">
        <div class="tobo-text">
          <h2>믿을 수 있는 <br>판다마켓 중고 거래</h2>
        </div>
        <img class="tobo-img" src="./img/Img_home_bottom.png" alt="장바구니를 들며 대화하는 두 판다 캐릭터">
      </div>
    </section>
  </main>
  <footer id="footer">
    <div id="footer-box">
      <p id="copyright">©codeit - 2024</p>

        <li><a href="/privacy">Privacy Policy</a></li>
        <li><a href="/faq">FAQ</a></li>
      </ul>

        <li><a href="https://facebook.com" target='_blank'><img src="./img/ic_facebook.png"></a></li>
        <li><a href="https://x.com" target='_blank'><img src="./img/ic_twitter.png"></a></li>
        <li><a href="https://youtube.com" target='_blank'><img src="./img/ic_youtube.png"></a></li>
        <li><a href="https://instagram.com" target='_blank'><img src="./img/ic_instagram.png"></a></li>
      </ul>
    </div>
