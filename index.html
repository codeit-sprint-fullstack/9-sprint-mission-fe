				<a href="https://pandamarket-powerima.netlify.app/"><img class="logo-image" src="images/logo_pandamarket.svg" /></a>

			</div>
		</div>

	<!-- 페이지 메인의 상단 배너	-->
	<main class="main-content">
		<div class="section top">
			<div class="container">
				<div class="content">
					<h2 class="title">일상의 모든 물건을<br>거래해 보세요</h2>

			</div>
		</div>

		<!-- 페이지 메인의 본문 -->
		<div class="section main odd">
			<div class="container">
				<img class="section-image" src="images/Img_home_01.png" />

					<h2 class="tag">Hot Item</h2>
					<h2 class="title">인기 상품을<br>확인해 보세요</h2>

					</p>
				</div>
			</div>
		</div>

		<div class="section main even">
			<div class="container">
				<img class="section-image" src="images/Img_home_02.png" />

			</div>
		</div>

		<div class="section main odd">
			<div class="container">
				<img class="section-image" src="images/Img_home_03.png" />
				<div class="content">
					<h2 class="tag">Register</h2>
					<h2 class="title">판매를 원하는<br>상품을 등록하세요</h2>
					<p class="description">
						어떤 물건이든 판매하고 싶은 상품을<br>
						쉽게 등록하세요
					</p>
				</div>
			</div>
		</div>

		<!--	페이지 메인의 하단 배너 -->

			<div class="section-div">
				<div class="container">	
					<h2 class="title">믿을 수 있는<br>판다마켓 중고 거래</h2>                    
					<img class="banner bottom" src="images/Img_home_bottom.png" />
