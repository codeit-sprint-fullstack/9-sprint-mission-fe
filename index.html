<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>판다마켓</title>
  <link rel="icon" href="panda.ico.webp">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<!-- HeaderStart -->
 <header class="header">
  <div class="container header-inner">
    <a href="#" class="logo" aria-label="판다마켓 홈">
      <img src="판다 얼굴.svg" alt="판다마켓 로고" />
      <span class="logo-text">판다마켓</span>
    </a>
    <div class="auth">
      <a class="btn-login" href="/login">로그인</a>
    </div>
  </div>
</header>
<!-- HeaderEnd -->
<section class="landing-hero">
  <div class="landing-text">
    <h1>일상의 모든 물건을<br>거래해 보세요</h1>
    <a class="btn-primary" href="/items">구경하러 가기</a>
  </div>
  <div class="landing-illustration">
    <img src="img_home_top.png" alt="팬더 캐릭터" />
  </div>
</section>
<!-- Section1_Start -->
<div class="section-1">
  <div class="img-landing-desktop-02">
    <div class="img-home-01">
      <img src="img_home_01.png" alt="인기 상품 이미지" />
    </div>
  </div>
 <div class="section1-content">
  <div class="section1-hot-item">Hot item</div>
  <div class="section1-texts">
    <div class="section1-title">인기 상품을<br />확인해 보세요</div>
    <div class="section1-subtitle">
      가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</div>
  </div>
 </div>
</div>
<!-- Section 2 -->
<div class="section-2">
  <div class="section2-content">
    <div class="section2-search">Search</div>
    <div class="section2-texts">
      <div class="section2-title">구매를 원하는<br />상품을 검색하세요</div>
      <div class="section2-subtitle">구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</div>
    </div>
  </div>
  <div class="img-landing-desktop-03">
    <div class="img-home-02">
      <img src="img_home_02.png" alt="구매 상품 검색" />
    </div>
  </div>
</div>

<!-- Section 3 -->
<div class="section-3">
  <div class="img-landing-desktop-04">
    <div class="img-home-03">
      <img src="img_home_03.png" alt="판매 상품 등록" />
    </div>
  </div>
  <div class="section3-content">
    <div class="section3-hot-item">Register</div>
    <div class="section3-texts">
      <div class="section3-title">판매를 원하는<br />상품을 등록하세요</div>
      <div class="section3-subtitle">어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</div>
    </div>
  </div>
</div>

<!-- Bottom Banner -->
<section class="landing-bottom">
  <div class="landing-text">
    <h1>믿을 수 있는<br>판다마켓 중고 거래</h1>
  </div>
  <div class="landing-illustration">
    <img src="img_home_bottom.png" alt="팬더 바닥" />
  </div>
</section>

<!-- Footer -->
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="copyright">© codeit - 2024</div>
    <nav class="footer-nav" aria-label="하단 링크">
      <a href="/privacy">Privacy Policy</a>
      <a href="/faq">FAQ</a>
    </nav>
    <div class="social">
      <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="facebook"><img src="ic_facebook.png" alt="Facebook"></a>
      <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" aria-label="twitter"><img src="ic_twitter.png" alt="Twitter"></a>
      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="youtube"><img src="ic_youtube.png" alt="YouTube"></a>
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="instagram"><img src="ic_instagram.png" alt="Instagram"></a>
    </div>
  </div>
</footer>

</body>
</html>
