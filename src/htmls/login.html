<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/style-login.css">
  <title>판다 마켓 로그인</title>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo-link" href="../../index.html">
        <img class="logo-img" src="../assets/images/panda-market.png" alt="판다 마켓 로고">
      </a>
    </header>
    <main>
      <!-- 로그인 -->
      <section class="login-form">
        <!-- 로그인 폼 -->
        <form action="#" method="post">
          <!-- 이메일 -->
          <div class="form-group">
            <label for="user-email">이메일</label>
            <input type="email" id="user-email" name="user-email" placeholder="이메일을 입력해주세요" required>
          </div>
          <!-- 비밀번호 -->
          <div class="form-group">
            <label for="user-pw">비밀번호</label>
            <div class="pw-wrap">
              <input type="password" id="user-pw" name="user-pw" placeholder="비밀번호를 입력해주세요" required>
              <!-- 비밀번호 표시 -->
              <img src="../assets/icons/btn_visibility_off_24px.svg" alt="비밀번호 표시">
            </div>
          </div>
          <!-- 로그인 버튼 -->
          <button type="submit">로그인</button>
        </form>
      </section>
      <!-- 간편 로그인 -->
      <section class="easy-login-wrap">
        <span>간편 로그인하기</span>
        <div class="icon-links-wrap">
          <a href="https://www.google.com">
            <img class="icon-img" src="../assets/icons/google_icon@3x.png" alt="구글로 가기">
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img class="icon-img" src="../assets/icons/katalk_icon@3x.png" alt="카카오로 가기">
          </a>
        </div>
      </section>
    </main>
    <footer>
      <p>
        판다마켓이 처음이신가요? 
        <a href="./signup.html" class="link">회원가입</a>
      </p>
    </footer>
  </div>
</body>
</html>
