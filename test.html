    .box1 {

    .box2 {
      width: 100%;
      height: 200px;
      background: blue;
      opacity: 50%;
    }

  </style>
</head>
<body>

  <div>
    <a class="button" href="#"></a>

    </div>
    <div class="box2">

</html>
